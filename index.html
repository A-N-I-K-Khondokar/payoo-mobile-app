<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mobile App</title>
    <!-- tailwind cdn  -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- daisyUI cdn -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
  </head>
  <body class="max-w-md mx-auto min-h-screen flex flex-col justify-center justify-items-center px-4">
    <!-- top section of login -->
    <div class="flex flex-col justify-center items-center">
        <img class="w-16 h-16 relative top-30" src="./assets/Group.png" alt="">
        <img src="./assets/bg.png" class="bg-cover  w-full " alt="">
    </div>

    <!-- bottom section of login -->
    <div class="relative bottom-40">
      <label class="font-semibold text-xl" for="">Mobile Number</label> <br>
      <input class="w-full my-4 h-[53px] text-gray-500 pl-3 border-none" type="text" name="" id="" placeholder="Enter Your Mobile Number" /> <br>
      <label class="font-semibold text-xl" for="">4 digit pin</label> <br>
      <input class="w-full my-4 h-[53px]  text-gray-500 pl-3 border-none" type="text" name="" id="" placeholder="Enter 4 Digit Pin" /> <br>
      <button class="btn bg-[#0874F2] w-full h-[53px] text-white font-semibold text-xl rounded-3xl">Secondary</button>
    </div>

    <!-- javaScript link -->
    <script src="./index.js"></script>
  </body>
</html>
